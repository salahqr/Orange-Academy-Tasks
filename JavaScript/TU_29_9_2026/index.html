<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 16px; }
    form { display: grid; gap: 10px; margin-bottom: 24px; }
    input, button { padding: 8px; font-size: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    #total { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Employee Management System</h1>

  <form id="employeeForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="department" placeholder="Department" required>
    <button type="submit">Add Employee</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Employee Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Salary</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <p id="total"></p>

  <script src="./index.js"></script>
</body>
</html>
