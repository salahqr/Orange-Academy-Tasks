<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * { box-sizing: border-box; padding: 0; margin: 0; }
        body { background-color: antiquewhite; color: #222; padding: 20px; }
        #acount_list p { margin: 4px 0; font-size: larger; }
        #acount_list h3 { margin: 20px 0 10px; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { border: 1px solid #999; padding: 8px 12px; text-align: left; }
        th { background: aquamarine; }
        #logout { margin-top: 15px; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="acount_list"></div>
    <button id="logout">Logout</button>
    <script src="./index.js"></script>
</body>
</html>
