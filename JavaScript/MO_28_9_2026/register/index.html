<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="registration" id="registration">
  <div class="register-container" id="register-container">

    <h1 class="register-title" id="register-title">Sign Up</h1>

    <form class="register-form" id="register-form">

      <label for="regFullName">Full Name</label><br>
      <input type="text" class="register-input" id="regFullName" name="fullName"><br><br>

      <label for="regEmail">Email</label><br>
      <input type="email" class="register-input" id="regEmail" name="email"><br><br>

      <label for="regPassword">Password</label><br>
      <input type="password" class="register-input" id="regPassword" name="password"><br><br>

      <label for="regAddress">Address</label><br>
      <input type="text" class="register-input" id="regAddress" name="address"><br><br>

      <label for="regConfirmPassword">Confirm Password</label><br>
      <input type="password" class="register-input" id="regConfirmPassword" name="confirmPassword"><br><br>

      <button type="submit" class="register-button" id="register-button">Register</button>

    </form>

    <p id="registerMsg"></p>

   <p>You have an account? <a href="../login/login.html">Login</a></p>

  </div>
</div>

<script src="./scrpit.js"></script>
</body>
</html>
