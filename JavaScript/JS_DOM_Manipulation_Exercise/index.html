<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Checklist</title>

  <!-- The styling is already done for you. Your job is the JavaScript.
       Notice the classes .done, .hidden, and .active below:
       your code will add and remove them with classList. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0d1a; color: #f4f4f8; padding: 40px 16px; }

    .app { max-width: 520px; margin: 0 auto; background: rgba(255,255,255,0.05); border-radius: 14px; padding: 28px; }

    h1 { color: #00CEC9; margin-bottom: 4px; }

    .subtitle { color: #9a9ac0; margin-bottom: 20px; font-size: 14px; }

    form { display: flex; gap: 8px; margin-bottom: 6px; }

    input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: #fff; font: inherit; }

    button { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; }

    #task-form button { background: #6C5CE7; color: #fff; }

    #char-count { font-size: 12px; color: #9a9ac0; margin-bottom: 16px; }

    .filters { display: flex; gap: 8px; margin-bottom: 16px; }

    .filter-btn { background: #1a1a2e; color: #c9c9e0; }

    .filter-btn.active { background: #00CEC9; color: #0d0d1a; }

    ul { list-style: none; }

    li { display: flex; justify-content: space-between; align-items: center; background: #1a1a2e; padding: 12px 14px; border-radius: 8px; margin-bottom: 8px; }

    .task-text { cursor: pointer; flex: 1; }

    li.done .task-text { text-decoration: line-through; color: #6b6b8a; }

    .delete-btn { background: #FD79A8; color: #fff; padding: 6px 12px; font-size: 13px; }

    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 14px; color: #9a9ac0; }

    #clear-done { background: transparent; color: #FD79A8; padding: 0; }

    #empty-msg { text-align: center; color: #6b6b8a; padding: 20px 0; }
    
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="app">
    <h1>Mission Checklist</h1>
    <p class="subtitle">Everything the crew must finish before launch.</p>

    <!-- Form to add a new task -->
    <form id="task-form">
      <input type="text" id="task-input" placeholder="e.g. Check the fuel levels" maxlength="50">
      <button type="submit">Add</button>
    </form>
    <p id="char-count">0 / 50</p>

    <!-- Filter buttons (used in the BONUS steps).
         data-filter stores which filter each button applies. -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <!-- EMPTY on purpose: your JavaScript builds the items -->
    <ul id="task-list"></ul>

    <!-- Shown only when there are no tasks at all -->
    <p id="empty-msg" class="hidden">No tasks yet. Add your first mission task.</p>

    <div class="footer">
      <span id="counter">0 task(s) remaining</span>
      <button id="clear-done">Clear completed</button>
    </div>
  </div>

  <!-- Script at the end of body, so all elements exist first -->
  <script src="./script.js"></script>

</body>
</html>
