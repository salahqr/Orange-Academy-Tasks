<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Complete your travel reservation with JOD Airline — flights, hotels, and tours.">
    <title>Booking Form | JOD Airline</title>
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/2830/2830289.png">
</head>
<body>
    <header>
        <h1>JOD Airline</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#destination">Destination</a></li>
                <li><a href="index.html#travel_information">Travel Information</a></li>
                <li><a href="booking.html">Book Now</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Complete Your Reservation</h2>

        <!-- One unified form, action/target/autocomplete on the form itself -->
        <form action="/api/1/booking" target="_self" autocomplete="on">

            <!-- ===== Personal Information ===== -->
            <fieldset>
                <legend>Personal Information</legend>

                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" required><br><br>

                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" required><br><br>

                <label for="password">Password</label>
                <input type="password" name="password" id="password" required><br><br>

                <label for="tel">Phone Number</label>
                <input type="tel" name="tel" id="tel" required><br><br>

                <label for="dob">Date of Birth</label>
                <input type="date" name="dob" id="dob" required>
            </fieldset>

            <br>

            <!-- ===== Travel Details ===== -->
            <fieldset>
                <legend>Travel Details</legend>

                <label for="city">Departure City</label>
                <input type="text" name="city" id="city" size="20" required><br><br>

                <label for="destination">Destination</label>
                <select name="destination" id="destination" required>
                    <optgroup label="Europe">
                        <option value="Paris">Paris</option>
                        <option value="Rome">Rome</option>
                        <option value="Istanbul">Istanbul</option>
                    </optgroup>
                    <optgroup label="Asia">
                        <option value="Tokyo">Tokyo</option>
                        <option value="Bangkok">Bangkok</option>
                        <option value="Bali">Bali</option>
                    </optgroup>
                    <optgroup label="Middle East">
                        <option value="Dubai">Dubai</option>
                        <option value="Amman">Amman</option>
                        <option value="Doha">Doha</option>
                    </optgroup>
                </select><br><br>

                <label for="travelDate">Travel Date</label>
                <input type="date" name="travelDate" id="travelDate" required><br><br>

                <label for="numtravel">Number of Travelers</label>
                <input type="number" name="numtravel" id="numtravel" min="1" max="6" required><br><br>

                <p>Travel Class</p>
                <input type="radio" name="travelClass" id="economy" value="Economy" checked>
                <label for="economy">Economy</label>

                <input type="radio" name="travelClass" id="business" value="Business">
                <label for="business">Business</label>

                <input type="radio" name="travelClass" id="first" value="First Class">
                <label for="first">First Class</label>
                <br><br>

                <p>Additional Services</p>
                <input type="checkbox" name="services" id="transfer" value="Airport Transfer">
                <label for="transfer">Airport Transfer</label><br>

                <input type="checkbox" name="services" id="hotel" value="Hotel Reservation">
                <label for="hotel">Hotel Reservation</label><br>

                <input type="checkbox" name="services" id="insurance" value="Travel Insurance">
                <label for="insurance">Travel Insurance</label><br>

                <input type="checkbox" name="services" id="tour" value="Guided Tour">
                <label for="tour">Guided Tour</label>
            </fieldset>

            <br>

            <!-- ===== Advanced Form Features ===== -->
            <fieldset>
                <legend>Additional Details</legend>

                <label for="requests">Special Requests</label><br>
                <textarea name="requests" id="requests" rows="4" cols="40"
                    placeholder="Let us know about any special requirements..."
                    maxlength="300"></textarea><br><br>

                <label for="docs">Upload Documents (passport, ID)</label>
                <input type="file" name="docs" id="docs" required multiple><br><br>

                <label for="package">Preferred Package</label>
                <input type="text" name="package" id="package" list="packages" placeholder="Start typing...">
                <datalist id="packages">
                    <option value="Istanbul Explorer">
                    <option value="Dubai Luxury Escape">
                    <option value="Bali Adventure Package">
                    <option value="Rome Classic Tour">
                </datalist><br><br>

                <label for="bookingRef">Booking Reference</label>
                <input type="text" name="bookingRef" id="bookingRef" value="BKG-2026-0915" readonly><br><br>

                <label for="promo">Promotional Discount</label>
                <input type="text" name="promo" id="promo" value="No active promotions" disabled>
            </fieldset>

            <br>

            <button type="submit">Book Now</button>
            <button type="reset">Clear Form</button>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 JOD Airline — Explore Istanbul. All rights reserved.</p>
    </footer>
</body>
</html>
