<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            display: grid;
            grid-template-columns: repeat(2, 250px);
            grid-template-rows: repeat(2, 250px);
            gap: 1px;
        }

        img {
            width: 250px;
            height: 250px;
        }

        body img:nth-child(1){grid-area: 1 / 1 / 2 / 2;}
        body img:nth-child(2){grid-area: 1 / 2 / 2 / 3;}
        body img:nth-child(3){grid-area: 2 / 1 / 3 / 2;}
        body img:nth-child(4){grid-area: 2 / 2 / 3 / 3;}
    </style>
</head>
<body>
    <img src="../assets/breathtaking_landscape_photography_of_a_lush_ancient_temperate_rainforest_with.png" alt="">
    <img src="../assets/dramatic_coastal_seascape_photography_of_powerful_ocean_waves_crashing_against.png" alt="">
    <img src="../assets/macro_nature_photography_of_glistening_morning_dew_drops_resting_on_a_vibrant.png" alt="">
    <img src="../assets/majestic_alpine_mountain_lake_at_sunrise_crystal_clear_turquoise_water_with.png" alt="">
</body>
</html>
