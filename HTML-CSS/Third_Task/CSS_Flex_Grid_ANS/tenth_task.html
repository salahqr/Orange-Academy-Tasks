<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            display: grid;
            grid-template-columns: repeat(4, 300px);
            grid-template-rows: repeat(4, 300px);
            gap: 8px;
        }

        div{
            width: 300px;
            height: 300px;
            background-color: rgb(181, 204, 247);
        }

        div.one{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
        }

        .one p{
            background-color: bisque;
        }

        .one p:nth-child(1) {grid-area: 1 / 1 / 2 / 2;}
        .one p:nth-child(2) {grid-area: 1 / 2 / 2 / 3;}
        .one p:nth-child(3) {grid-area: 2 / 1 / 3 / 2;}
        .one p:nth-child(4) {grid-area: 2 / 2 / 3 / 3;}

        div.two{
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
        }

        .two p{
            background-color: bisque;
        }

        .two p:nth-child(1) {grid-area: 1 / 1 / 2 / 2;}
        .two p:nth-child(2) {grid-area: 2 / 1 / 3 / 2;}

        div.three{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: 1fr;
            gap: 8px;
        }

        .three p{
            background-color: bisque;
        }

        .three p:nth-child(1) {grid-area: 1 / 1 / 2 / 2;}
        .three p:nth-child(2) {grid-area: 1 / 2 / 2 / 3;}
    </style>
</head>
<body>
    <div></div>
    <div class="one">
        <p></p>
        <p></p>
        <p></p>
        <p></p>
    </div>
    <div class="one">
        <p></p>
        <p></p>
        <p></p>
        <p></p>
    </div>
    <div></div>
    <div></div>
    <div class="two">
        <p></p>
        <p></p>
    </div>
    <div class="three">
        <p></p>
        <p></p>
    </div>
    <div></div>
    <div class="one">
        <p></p>
        <p></p>
        <p></p>
        <p></p>
    </div>
    <div></div>
    <div></div>
    <div class="one">
        <p></p>
        <p></p>
        <p></p>
        <p></p>
    </div>
</body>
</html>
