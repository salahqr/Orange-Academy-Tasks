<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Mock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: red;
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            margin: 0 20px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
        }

        .icons {
            display: flex;
            gap: 16px;
        }

        /* Layout: sidebar + content */
        .container {
            display: flex;
        }

        aside {
            width: 200px;
            padding: 16px;
            border-right: 1px solid #e0e0e0;
            height: calc(100vh - 56px);
        }

        aside ul {
            list-style: none;
        }

        aside li {
            padding: 10px 0;
            cursor: pointer;
        }

        aside li:hover {
            color: red;
        }

        /* Video grid */
        main {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .video-card {
            width: 260px;
        }

        .thumbnail {
            width: 100%;
            height: 150px;
            background-color: #ccc;
            border-radius: 8px;
        }

        .video-title {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .channel-name {
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">YouTube</div>
        <input type="text" class="search-bar" placeholder="Search">
        <div class="icons">🔔 👤</div>
    </header>

    <div class="container">
        <aside>
            <ul>
                <li>🏠 Home</li>
                <li>🔥 Trending</li>
                <li>📺 Subscriptions</li>
                <li>📚 Library</li>
                <li>🕒 History</li>
            </ul>
        </aside>

        <main>
            <div class="video-card">
                <div class="thumbnail"></div>
                <div class="video-title">Video Title 1</div>
                <div class="channel-name">Channel Name</div>
            </div>
            <div class="video-card">
                <div class="thumbnail"></div>
                <div class="video-title">Video Title 2</div>
                <div class="channel-name">Channel Name</div>
            </div>
            <div class="video-card">
                <div class="thumbnail"></div>
                <div class="video-title">Video Title 3</div>
                <div class="channel-name">Channel Name</div>
            </div>
            <div class="video-card">
                <div class="thumbnail"></div>
                <div class="video-title">Video Title 4</div>
                <div class="channel-name">Channel Name</div>
            </div>
        </main>
    </div>

</body>
</html>
