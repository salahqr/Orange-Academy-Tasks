<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .fourth_part {
            position: relative;
            padding: 10px;
        }

        .fourth_part div {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 1px solid black;
            border-radius: 1.5px;
            color: whitesmoke;
            margin: 5px;
        }

        .fourth_part div:nth-child(1) {
            position:sticky;
            background-color: #e6194B;
            margin-top: 100px;
            margin-left: 180px;
            z-index: 2; /*have problme in video you put sticky put in 
            task you put static*/
        }

        .fourth_part div:nth-child(2)  { 
            background-color: #3cb44b; 
            top: 60px;
            left: 250px;
        }

        .fourth_part div:nth-child(3)  { 
            background-color: #4363d8;
            top: 60px;
            left: 370px;
        }

        .fourth_part div:nth-child(4)  { 
            background-color: #f58231; 
            top: 60px;
            left: 490px;
        }

        .fourth_part div:nth-child(5)  { 
            background-color: #911eb4; 
            top: 180px;
            left: 130px;
        }

        .fourth_part div:nth-child(6)  { 
            background-color: #42d4f4;
            top: 180px;
            left: 250px;
        }

        .fourth_part div:nth-child(7)  { 
            background-color: #f032e6; 
            top: 180px;
            left: 370px;
        }

        .fourth_part div:nth-child(8)  { 
            background-color: #bfef45;
            top: 180px;
            left: 490px;
         }


        .fourth_part div:nth-child(9)  { 
            background-color: #fabed4; 
            top: 300px;
            left: 130px;
        }

        .fourth_part div:nth-child(10) { 
            background-color: #469990;
            top: 300px;
            left: 250px;
        }

        .fourth_part div:nth-child(11) {
            background-color: #dcbeff;
            top: 300px;
            left: 370px;
        }

        .fourth_part div:nth-child(12) { 
            background-color: #9A6324; 
            top: 300px;
            left: 490px;
        }
    </style>
</head>
<body>
    <div class="fourth_part">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>10</div>
        <div>11</div>
        <div>12</div>
    </div>
</body>
</html>
