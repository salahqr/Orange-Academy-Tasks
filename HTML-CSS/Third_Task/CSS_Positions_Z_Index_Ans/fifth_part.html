<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            font-size: 1.2rem;
        }

        div {
            position: absolute;
            top: 100px;
            left: 100px;
            border: 3px cyan solid;
            width: 200px;
            height: 200px;
            text-align: center;
            background-color: white;

            box-shadow: 
                10px -10px 0 gray,
                20px -20px 0 blue,
                30px -30px 0 red,
                40px -40px 0 green,
                50px -50px 0 yellow;
        }
    </style>
</head>
<body>
    <div>Multi box shadow</div>
</body>
</html>
