<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            font-size: 1.2rem;
        }
                
        .third_part{
            position: relative; 
            margin-top: 10px;
            height: 100vh;
        }

        .third_part > div{
            border: 1px solid black;
            border-radius: 1.5px;
            width: 200px;
            height: 200px;
            position: absolute;
            color: whitesmoke;
        }

        .third_part .one {
            background-color: blue;
            top: 0;
            left: 0;
        }

        .third_part .two{
            background-color: red;
            top: 0;
            right: 0;
        }

        .third_part .three{
            background-color: yellow;
            bottom: 0;
            left: 0;
        }

        .third_part .four{
            background-color: green;
            bottom: 0;
            right: 0;
        }
    </style>
</head>
<body>
    <div class="third_part">
        <div class="one">absolute</div>
        <div class="two">absolute</div>
        <div class="three">absolute</div>
        <div class="four">absolute</div>
    </div>
</body>
</html>
