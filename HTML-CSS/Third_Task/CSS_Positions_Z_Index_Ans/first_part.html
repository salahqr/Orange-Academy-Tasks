<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .first_part {
           position: relative;
        }

        .first_part .one{
            border: 1px #2a2a22 solid ;
            position: relative;
            background: azure;
            width: 100%;
            height: 100px;
        }

        .first_part .two {
            border: 1px #2a2a22 solid ;
            position: fixed;
            z-index: 2;
            background: blue;
            width: 70%;
            top: 120px;
            left: 20px;
            height: 100px;
            
        }

        .first_part .three {
            border: 1px #2a2a22 solid ;
            position: absolute;
            z-index: 1;
            background: greenyellow;
            width: 300px;
            height: 100px;
            top: 40px;
            left: 32%;
        }

    </style>
</head>
<body>
    <div class="first_part">
        <h2>This your first position & Z index task</h2>
        <div class="one">Div1 position=Relative </div>
        <div class="two">Div2 position=fixed & z-index </div>
        <div class="three">Div3 position=absolute</div>
    </div>
</body>
</html>
